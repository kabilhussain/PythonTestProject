sonar.projectKey=buggy-python-app
sonar.projectName=Buggy Python App
sonar.projectVersion=0.1.0
sonar.sources=buggy_app
sonar.tests=tests
sonar.language=py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# Import results from other tools into SonarQube
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/pytest-junit.xml
sonar.python.bandit.reportPaths=reports/bandit.json
sonar.python.pylint.reportPaths=reports/pylint.txt
sonar.python.flake8.reportPaths=reports/flake8.txt
sonar.python.ruff.reportPaths=reports/ruff.json
sonar.python.mypy.reportPaths=reports/mypy.txt
